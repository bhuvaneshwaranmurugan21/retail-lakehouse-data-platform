version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer_email_hash
        tests: [not_null]
      - name: net_amount
        tests: [not_null]

  - name: fct_daily_sales
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [order_date, store_id, currency]
    columns:
      - name: net_sales
        tests: [not_null]

  - name: fct_order_fulfillment
    columns:
      - name: order_id
        tests: [not_null, unique]

  - name: fct_inventory_position
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [movement_date, location_id, sku]

