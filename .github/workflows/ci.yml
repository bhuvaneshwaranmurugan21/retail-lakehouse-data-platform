name: pipeline-quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pipeline-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: python -m pip install -e ".[spark,dev]"

      - name: Lint Python
        run: python -m ruff check src spark_jobs scripts tests

      - name: Validate source contracts
        run: python scripts/validate_contracts.py config/contracts

      - name: Run unit and Spark integration tests
        run: python -m pytest --cov=retail_lakehouse --cov-report=term-missing

