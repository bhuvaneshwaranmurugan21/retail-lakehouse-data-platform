[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-lakehouse-data-platform"
version = "1.0.0"
description = "Metadata-driven retail lakehouse pipelines for AWS and Apache Spark"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
spark = [
  "pyspark>=3.5,<4.1",
]
analytics = [
  "dbt-core>=1.9,<2",
  "dbt-redshift>=1.9,<2",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
